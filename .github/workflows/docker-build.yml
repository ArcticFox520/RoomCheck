name: docker-build

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "自定义镜像 Tag（留空则只使用 sha）"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: arcticfox520/roomcheck

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools file binutils python3
      - name: 构建并运行完整测试
        run: |
          make dev
          make test
      - name: 前端静态检查（CSP / CSS 孤儿 / 禁用样式）
        run: python3 scripts/check_frontend.py
      - name: musl 静态构建验证（amd64）
        run: |
          make static
          ./scripts/verify-static.sh build/RoomCheck amd64 --run

  prepare:
    name: prepare metadata
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.decide.outputs.push }}
    steps:
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - id: decide
        run: echo "push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

  docker-build-amd64:
    name: docker-build-amd64
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（PR 验证）
        if: needs.prepare.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: roomcheck:ci-amd64
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - name: 容器冒烟测试（PR 验证）
        if: needs.prepare.outputs.push != 'true'
        run: |
          docker run -d --name rc-smoke -p 18080:8080 \
            -e ADMIN_INIT_PASSWORD=SmokeTest#2026 roomcheck:ci-amd64
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/health.json; then ok=1; break; fi
            sleep 1
          done
          docker logs rc-smoke || true
          cat /tmp/health.json || true
          docker rm -f rc-smoke
          [ "$ok" = "1" ]
      - name: 登录 Docker Hub
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 amd64 digest
        if: needs.prepare.outputs.push == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - name: 导出 digest
        if: needs.prepare.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/amd64
          cat /tmp/digests/amd64
      - name: 上传 digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-amd64
          path: /tmp/digests/amd64
          retention-days: 1

  docker-build-arm64:
    name: docker-build-arm64
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（PR 验证）
        if: needs.prepare.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: 登录 Docker Hub
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 arm64 digest
        if: needs.prepare.outputs.push == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: 导出 digest
        if: needs.prepare.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/arm64
          cat /tmp/digests/arm64
      - name: 上传 digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-arm64
          path: /tmp/digests/arm64
          retention-days: 1

  docker-manifest:
    name: docker-manifest
    needs: [prepare, docker-build-amd64, docker-build-arm64]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 创建多架构 manifest
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          amd="$(cat /tmp/digests/amd64)"
          arm="$(cat /tmp/digests/arm64)"
          args=()
          first_tag=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            args+=(--tag "$tag")
            [ -z "$first_tag" ] && first_tag="$tag"
          done <<< "${TAGS}"
          echo "创建 tags: ${args[*]}"
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE_NAME}@${amd}" "${IMAGE_NAME}@${arm}"
          docker buildx imagetools inspect "${first_tag}" | tee /tmp/manifest.txt
          grep -q "linux/amd64" /tmp/manifest.txt
          grep -q "linux/arm64" /tmp/manifest.txt

  build-report:
    name: build-report
    needs: [prepare, docker-build-amd64, docker-build-arm64, docker-manifest]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 写入构建报告
        run: |
          echo "## RoomCheck Docker 构建报告" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 事件: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 推送镜像: \`${{ needs.prepare.outputs.push }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 镜像: \`arcticfox520/roomcheck\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.prepare.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest 结果: \`${{ needs.docker-manifest.result }}\`" >> "$GITHUB_STEP_SUMMARY"
