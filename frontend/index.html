<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e0e5ec" id="themeColorMeta">
  <meta name="description" content="RoomCheck 寝室抽查管理系统：寝室配置、每周排班、查寝进度、备注图片与账户管理。">
  <title>RoomCheck · 寝室抽查管理系统</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body>
  <!-- 内联 SVG 图标库：全部使用 currentColor 描边，不使用外部图标资源 -->
  <svg class="icon-library" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4.5 12.5l4.5 4.5L19.5 6.5"/></symbol>
    <symbol id="icon-note" viewBox="0 0 24 24"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4"/><path d="M9 12h7M9 15.5h5"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M20.5 15l-4.5-4.5L6.5 20"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="icon-backup" viewBox="0 0 24 24"><path d="M4 8.5c0-2 3.6-3.5 8-3.5s8 1.5 8 3.5-3.6 3.5-8 3.5-8-1.5-8-3.5z"/><path d="M4 8.5v7c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-7"/><path d="M4 12c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5"/></symbol>
    <symbol id="icon-log" viewBox="0 0 24 24"><path d="M6 3.5h12v17H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><path d="M9 11a4 4 0 100-8 4 4 0 000 8z"/><path d="M2.5 20.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16.5 4.5a3.5 3.5 0 010 7"/><path d="M18 14.8c2.1.7 3.5 2.5 3.5 5.7"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></symbol>
    <symbol id="icon-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 3.5a8.5 8.5 0 010 17" fill="currentColor" stroke="none" opacity="0.22"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16z"/><path d="M13.5 5.5l4 4"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3.5L21 20H3z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/><path d="M12 14v3"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 5v5h-5"/><path d="M20 10a8 8 0 10.5 5"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4M6 12h11"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5l1.4 2.6 2.9.6 2.1-2 2 2-2 2.1.6 2.9 2.5 1.3-2.5 1.3-.6 2.9 2 2.1-2 2-2.1-2-2.9.6L12 21.5l-1.4-2.5-2.9-.6-2.1 2-2-2 2-2.1-.6-2.9L2.5 12 5 10.7l.6-2.9-2-2.1 2-2 2.1 2 2.9-.6z"/></symbol>
    <symbol id="icon-building" viewBox="0 0 24 24"><path d="M4 21V8l8-4 8 4v13"/><path d="M9 21v-6h6v6"/><path d="M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 9.5h17"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6.5 20V12M12 20V5M17.5 20v-5"/></symbol>
  </svg>

  <div id="boot" class="boot" role="status">
    <div class="boot-brand">
      <img class="brand-logo" src="/assets/logo.svg" alt="" width="44" height="44">
      <span class="brand-name">RoomCheck</span>
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <p class="boot-text">正在载入寝室抽查管理系统…</p>
  </div>

  <div id="app" class="app" hidden>
    <div id="appHeader"></div>
    <main id="viewRoot" class="view-root" aria-live="polite"></main>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="false"></div>
  <div id="modalRoot" class="modal-root"></div>

  <noscript>
    <div class="noscript">RoomCheck 需要启用 JavaScript 才能使用，请在浏览器设置中启用后刷新页面。</div>
  </noscript>
</body>
</html>
